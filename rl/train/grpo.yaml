# Reference for the GRPO run. The RUNNABLE source of truth is run_grpo.sh (verl
# takes these as CLI overrides on its ppo_trainer defaults); this file documents
# the same settings and why they are what they are. Keys are verl 0.9.1.
#
# Integration shape (verl-native): the policy is expressed to verl as a set of
# h5i tools (train/h5i_tool.py, listed in train/h5i_tools.yaml), so verl's
# ToolAgentLoop owns generation, tool-call parsing, multi-turn tokenization and
# the response mask. The container lifecycle verl does NOT manage lives in
# env/serve_pool.py (a persistent pool + the parquet dataset). Reward is
# train/h5i_reward.py.

algorithm:
  adv_estimator: grpo          # group-relative advantages, no critic -> fits 4x3090

data:
  train_files: data/train.parquet   # written by env/serve_pool.py
  val_files: data/val.parquet
  return_raw_chat: true             # agent loop needs the raw messages
  train_batch_size: 8               # = number of pooled challenges
  max_prompt_length: 4096
  max_response_length: 8192         # a full multi-turn h5i trajectory

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-4B
    lora_rank: 32                   # LoRA = the only trainable params -> fits on-box
    lora_alpha: 64
    target_modules: all-linear
  actor:
    optim: {lr: 1.0e-6}
    ppo_mini_batch_size: 8
    use_kl_loss: true
    fsdp_config: {param_offload: true, optimizer_offload: true}
  rollout:
    name: vllm
    mode: async                     # server mode: required for the agent loop
    n: 8                            # GRPO group size (rollouts per challenge)
    temperature: 0.9
    tensor_model_parallel_size: 2   # rollout on 2 cards; FSDP train on the rest
    gpu_memory_utilization: 0.5
    multi_turn:
      enable: true
      format: hermes                # Qwen tool-call format; match to the model
      tool_config_path: train/h5i_tools.yaml
      max_assistant_turns: 25
      max_tool_response_length: 4096  # h5i observations are the signal -- NOT the 256 default

custom_reward_function:
  path: train/h5i_reward.py
  name: compute_score

trainer:
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 30
  logger: [console]
  project_name: h5i-rl
  experiment_name: qwen3-4b-grpo-lora
